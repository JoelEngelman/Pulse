name: Import Pulse from legacy repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[pulse-import-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4

      - name: Import legacy Pulse source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pulse-source
          git clone --depth 1 https://github.com/JoelEngelman/-Pulse-.git /tmp/pulse-source
          rm -rf /tmp/pulse-source/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/pulse-source/. .

      - name: Add restrictive-network compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/api-client-react/src/custom-fetch.ts')
          if p.exists():
              s = p.read_text()
              old = 'const DEFAULT_BROWSER_API_URL = "https://pulse-api-proxy.joeldavidengelman.workers.dev";'
              new = '''const DEFAULT_BROWSER_API_URL = "https://pulse-api-proxy.joeldavidengelman.workers.dev";\n\n// Keep browser traffic on ordinary HTTPS/443. School and enterprise networks\n// commonly allow normal HTTPS while restricting WebSockets, custom ports, or\n// non-HTTP transports. The app itself uses request/response polling for\n// realtime updates, so no WebSocket connection is required.\nfunction getBrowserApiUrl(): string {\n  if (typeof window === "undefined") return DEFAULT_BROWSER_API_URL;\n  const configured = (window as any).__PULSE_API_URL__;\n  if (typeof configured === "string" && configured.trim()) return configured.trim().replace(/\\/+$/, "");\n  return DEFAULT_BROWSER_API_URL;\n}'''
              if old in s:
                  s = s.replace(old, new)
              s = s.replace('const baseUrl = _baseUrl || (typeof window !== "undefined" ? DEFAULT_BROWSER_API_URL : null);', 'const baseUrl = _baseUrl || (typeof window !== "undefined" ? getBrowserApiUrl() : null);')
              p.write_text(s)

          # Document the important limitation: this improves compatibility but
          # does not and should not bypass a school policy that blocks Pulse.
          Path('SCHOOL-NETWORK-COMPATIBILITY.md').write_text('''# Pulse on restrictive school/enterprise networks\n\nPulse is designed to use ordinary HTTPS requests on port 443. Messaging updates use HTTP polling rather than requiring a WebSocket connection.\n\nIf the network permits GitHub Pages but blocks the current API hostname, deploy the API behind a hostname your organisation permits and set `window.__PULSE_API_URL__` before the app loads. Do not use this configuration to bypass a school or organisation's network policy.\n\nThe API must support HTTPS, CORS for the Pulse frontend origin, credentials, and the `/api/*` routes used by the app.\n''')

          marker = Path('.pulse-imported')
          marker.write_text('Imported from JoelEngelman/-Pulse- with HTTPS/polling compatibility updates.\n')
          PY

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pulse Import Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Import Pulse and improve restrictive-network compatibility [pulse-import-complete]" || exit 0
          git push
