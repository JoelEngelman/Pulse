name: Build Pulse Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Electron dependencies
        working-directory: electron
        run: npm install
      - name: Build installer
        working-directory: electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ matrix.os }}
          path: electron/dist/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Build web bundle
        run: pnpm --filter @workspace/chat-app build
        env:
          NODE_ENV: production
          BASE_PATH: /
      - name: Add Android project
        working-directory: mobile
        run: npx cap add android
      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/Pulse-Android.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android
          path: mobile/Pulse-Android.apk

  ios:
    name: iOS build (unsigned simulator app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Build web bundle
        run: pnpm --filter @workspace/chat-app build
        env:
          NODE_ENV: production
          BASE_PATH: /
      - name: Add iOS project
        working-directory: mobile
        run: npx cap add ios
      - name: Sync iOS
        working-directory: mobile
        run: npx cap sync ios
      - name: Build unsigned simulator app
        working-directory: mobile
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent mobile/build/Build/Products/Debug-iphonesimulator/App.app mobile/Pulse-iOS-Simulator.zip
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: pulse-ios-simulator
          path: mobile/Pulse-iOS-Simulator.zip

  release:
    name: Publish release assets
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.apk
