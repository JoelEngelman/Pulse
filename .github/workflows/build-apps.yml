name: Build Pulse Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'mobile/**'
      - 'artifacts/chat-app/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: electron
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Verify installer
        shell: bash
        run: |
          find electron/dist -maxdepth 1 -type f -print
          test -n "$(find electron/dist -maxdepth 1 -type f | head -n 1)"
      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ matrix.name }}
          path: electron/dist/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web app
        run: pnpm --filter @workspace/chat-app build
        env:
          NODE_ENV: production
          BASE_PATH: /
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android
      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release-assets
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-assets/Pulse-Android.apk
          test -f release-assets/Pulse-Android.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-Android
          path: release-assets/Pulse-Android.apk
          if-no-files-found: error

  release:
    name: Publish Pulse downloads
    needs: [desktop, android]
    if: ${{ always() && (needs.desktop.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download successful artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: pulse-*
          merge-multiple: true
      - name: Verify release files
        run: |
          find release-assets -type f -print
          test -n "$(find release-assets -type f | head -n 1)"
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pulse Latest
          prerelease: false
          make_latest: true
          body: |
            Latest native Pulse builds.

            Windows: Electron installer.
            macOS: Electron DMG.
            Linux: Electron AppImage.
            Android: installable debug APK.

            iPhone/iPad: Pulse runs in Safari until native Apple distribution is available.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.apk
          fail_on_unmatched_files: false
