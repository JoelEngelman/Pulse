name: Build Pulse Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'mobile/**'
      - 'artifacts/chat-app/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis
          - os: macos-latest
            target: dmg
          - os: ubuntu-latest
            target: AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build desktop installer
        working-directory: electron
        run: npx electron-builder --${{ matrix.target }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ matrix.os }}
          path: electron/dist/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Build web bundle
        run: pnpm --filter @workspace/chat-app build
        env:
          NODE_ENV: production
          BASE_PATH: /

      - name: Add Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Prepare APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk mobile/Pulse-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-android
          path: mobile/Pulse-Android.apk
          if-no-files-found: error

  release:
    name: Publish Pulse downloads
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: find release-assets -maxdepth 2 -type f -print

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pulse Latest
          prerelease: false
          make_latest: true
          body: |
            Latest native Pulse builds.

            Windows: real Electron desktop installer.
            macOS: real Electron desktop app installer.
            Linux: real Electron AppImage.
            Android: native Capacitor APK.

            iPhone/iPad: use Pulse in Safari. Public native iOS distribution requires Apple signing and distribution.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.apk
