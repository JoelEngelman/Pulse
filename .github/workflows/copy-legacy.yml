name: Copy legacy Pulse
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy source
        run: |
          set -e
          git clone --depth 1 https://github.com/JoelEngelman/-Pulse-.git /tmp/src
          rm -rf /tmp/src/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/src/. .
          printf '%s\n' '# Pulse network compatibility' '' 'Pulse uses standard HTTPS requests on port 443 and HTTP polling for realtime updates.' '' 'This improves compatibility with restrictive networks but does not bypass school or organisation network controls.' > SCHOOL-NETWORK-COMPATIBILITY.md
          git config user.name 'Pulse Migration Bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Rebuild Pulse from legacy repository [pulse-import-complete]' || exit 0
          git push --force origin HEAD:main
