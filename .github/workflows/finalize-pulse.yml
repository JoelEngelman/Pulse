name: Finalize Pulse migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .pulse-imported ]; then
            echo "Pulse import already completed."
            exit 0
          fi
          git clone --depth 1 https://github.com/JoelEngelman/-Pulse-.git /tmp/pulse-source
          rm -rf /tmp/pulse-source/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/pulse-source/. .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/api-client-react/src/custom-fetch.ts')
          if p.exists():
              s = p.read_text()
              s = s.replace('const DEFAULT_BROWSER_API_URL = "https://pulse-api-proxy.joeldavidengelman.workers.dev";', '''const DEFAULT_BROWSER_API_URL = "https://pulse-api-proxy.joeldavidengelman.workers.dev";

// Network-friendly transport: browser API traffic stays on standard HTTPS/443.
// Realtime UI updates use HTTP polling, so WebSockets/custom ports are not required.
function getBrowserApiUrl(): string {
  if (typeof window === "undefined") return DEFAULT_BROWSER_API_URL;
  const configured = (window as any).__PULSE_API_URL__;
  if (typeof configured === "string" && configured.trim()) return configured.trim().replace(/\\/+$/, "");
  return DEFAULT_BROWSER_API_URL;
}''')
              s = s.replace('const baseUrl = _baseUrl || (typeof window !== "undefined" ? DEFAULT_BROWSER_API_URL : null);', 'const baseUrl = _baseUrl || (typeof window !== "undefined" ? getBrowserApiUrl() : null);')
              p.write_text(s)
          Path('SCHOOL-NETWORK-COMPATIBILITY.md').write_text('''# Pulse network compatibility\n\nPulse uses standard HTTPS requests on port 443 and HTTP polling for message/presence updates instead of requiring a WebSocket connection.\n\nIf an organisation intentionally blocks the Pulse API hostname, the correct solution is to have the network administrator permit an approved HTTPS API hostname. This project does not attempt to bypass school or organisation network controls.\n''')
          Path('.pulse-imported').write_text('Imported from JoelEngelman/-Pulse- with network-compatibility updates.\n')
          PY

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pulse Migration Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Rebuild Pulse for restrictive-network compatibility [pulse-import-complete]" || exit 0
          git push --force origin HEAD:main
