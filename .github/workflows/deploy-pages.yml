name: Deploy Pulse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fix Social API routing and music search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("artifacts/chat-app/src/pages/social.tsx")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'const API="https://pulse-api-proxy.joeldavidengelman.workers.dev";',
              'const API="https://lbphvoonoxpbvpovozuo.supabase.co/functions/v1/pulse-api";'
          )
          s = s.replace('`/api/', '`/')
          s = s.replace('"/api/', '"/')
          old = 'async function api(path:string,options:RequestInit={}){const r=await fetch(`${API}${path}`,{...options,credentials:"include",headers:{"Content-Type":"application/json",...(options.headers||{})}});'
          new = 'async function api(path:string,options:RequestInit={}){const token=localStorage.getItem("pulse-supabase-access-token")||"";const r=await fetch(`${API}${path}`,{...options,credentials:"omit",headers:{"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{ }),...(options.headers||{})}});'
          if old not in s:
              raise SystemExit("Expected Social API helper was not found; refusing to build with an unsafe patch.")
          s = s.replace(old, new, 1)
          s = s.replace('method:p.liked?"DELETE":"POST"', 'method:"POST"')
          old_music = 'const searchMusic=async()=>{if(!query.trim())return;try{const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=15`);const d=await r.json();setTracks((d.results||[]).filter((x:Track)=>x.previewUrl));}catch{setError("Couldn\'t search the music library.");}};'
          new_music = '''const searchMusic=async()=>{\n  const q=query.trim();\n  if(!q)return;\n  try{\n    const variants=[q,q.replace(/[.]/g," ").replace(/\\s+/g," ").trim()];\n    const seen=new Set<string>();\n    const all:any[]=[];\n    for(const term of variants){\n      const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&limit=200&country=AU`);\n      const d=await r.json();\n      for(const x of (d.results||[])){\n        const key=`${x.trackId||x.trackName}-${x.artistName}`;\n        if(!seen.has(key)&&x.previewUrl){seen.add(key);all.push(x);}\n      }\n    }\n    const norm=(v:string)=>v.toLowerCase().replace(/[^a-z0-9]+/g,"").trim();\n    const nq=norm(q);\n    all.sort((a,b)=>{\n      const at=norm(a.trackName||""),bt=norm(b.trackName||"");\n      const aa=norm(a.artistName||""),ba=norm(b.artistName||"");\n      const as=(at===nq?100:0)+(aa&&nq.includes(aa)?35:0)+(nq.includes(at)?25:0);\n      const bs=(bt===nq?100:0)+(ba&&nq.includes(ba)?35:0)+(nq.includes(bt)?25:0);\n      return bs-as;\n    });\n    setTracks(all.slice(0,100));\n  }catch{setError("Couldn\\'t search the music library.");}\n};'''
          if old_music not in s:
              raise SystemExit("Expected music search function was not found; refusing to build with an unsafe patch.")
          s=s.replace(old_music,new_music,1)
          p.write_text(s,encoding="utf-8")
          PY
          grep -n "const API=" artifacts/chat-app/src/pages/social.tsx
          grep -n "const searchMusic=" artifacts/chat-app/src/pages/social.tsx

      - name: Build Pulse
        run: pnpm --filter @workspace/chat-app build
        env:
          NODE_ENV: production
          BASE_PATH: /Pulse/

      - name: Verify Pages entrypoint
        run: |
          test -f artifacts/chat-app/dist/public/index.html
          cp artifacts/chat-app/dist/public/index.html artifacts/chat-app/dist/public/404.html
          touch artifacts/chat-app/dist/public/.nojekyll
          echo "Pages artifact contents:"
          find artifacts/chat-app/dist/public -maxdepth 2 -type f | sort | head -100

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/chat-app/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
